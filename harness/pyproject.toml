[project]
name = "rdab-harness"
version = "0.1.0"
description = "Rare Disease Agent Benchmark evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "datasets>=2.16",
    "huggingface-hub>=0.20",
    "orjson>=3.9",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "tqdm>=4.66",
    "requests>=2.31",
    "openai>=1.30",
    "anthropic>=0.25",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]
